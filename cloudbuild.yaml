# Cloud Build pipeline: build with VITE_* env vars baked in, push to Artifact Registry,
# deploy to Cloud Run.
#
# Required substitution variables (set in the Cloud Build trigger UI):
#   _VITE_SUPABASE_URL       - Supabase project URL
#   _VITE_SUPABASE_ANON_KEY  - Supabase anon key
#
# Optional (have sensible defaults):
#   _SERVICE_NAME  - Cloud Run service name
#   _REGION        - GCP region
#   _REPO          - Artifact Registry repository name (must exist beforehand)

substitutions:
  _SERVICE_NAME: household-transfer-manager
  _REGION: asia-northeast1
  _REPO: household-transfer-manager
  _VITE_SUPABASE_URL: ''
  _VITE_SUPABASE_ANON_KEY: ''

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # 1. Build container image with VITE_* build args
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - --tag=$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_SERVICE_NAME:$SHORT_SHA
      - --tag=$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_SERVICE_NAME:latest
      - --build-arg=VITE_SUPABASE_URL=$_VITE_SUPABASE_URL
      - --build-arg=VITE_SUPABASE_ANON_KEY=$_VITE_SUPABASE_ANON_KEY
      - .

  # 2. Push both tags to Artifact Registry
  - name: gcr.io/cloud-builders/docker
    id: push
    args:
      - push
      - --all-tags
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_SERVICE_NAME

  # 3. Deploy new revision to Cloud Run
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE_NAME
      - --image=$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_SERVICE_NAME:$SHORT_SHA
      - --region=$_REGION
      - --platform=managed
      - --allow-unauthenticated

images:
  - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_SERVICE_NAME:$SHORT_SHA
  - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_SERVICE_NAME:latest
